name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
      - 'src/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r backend/requirements.txt ruff pytest pytest-asyncio httpx

      - name: Lint with ruff
        run: ruff check backend/

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          DATABASE_PATH: ':memory:'
          API_KEY: ''
